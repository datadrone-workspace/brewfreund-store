<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — Brewfreund</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <div class="auth-shell">
    <div class="card">
      <h1 style="font-size:1.8rem;">Create your account</h1>
      <p class="lede" style="margin-bottom:1.6em;">Save your address, track orders, and manage your subscription.</p>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required>
          <div class="field-error">Enter your name.</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
          <div class="field-error">Enter a valid email address.</div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6">
          <div class="field-error">Use at least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</main>

<script src="js/products.js"></script>
<script src="js/segment-analytics.js"></script>
<script src="js/app.js"></script>
<script>
  bfInitPage({ active: "" });

  document.getElementById("signup-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim().toLowerCase();
    var password = document.getElementById("password").value;

    var nameField = document.getElementById("name").closest(".field");
    var emailField = document.getElementById("email").closest(".field");
    var passField = document.getElementById("password").closest(".field");
    nameField.classList.toggle("invalid", name.length === 0);
    emailField.classList.toggle("invalid", !email.includes("@") || !email.includes("."));
    passField.classList.toggle("invalid", password.length < 6);
    if (name.length === 0 || !email.includes("@") || password.length < 6) return;

    bfSaveAccount(email, { name: name, password: password });
    bfSetUser({ email: email, name: name });
    var userId = bfIdentify(email, { name: name, email: email });
    bfTrack("Signed Up", { email: email, name: name });

    window.location.href = "account.html";
  });
</script>
</body>
</html>
