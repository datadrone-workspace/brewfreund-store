<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile explorer reorder — Lena Müller to top</title>
<!--
  Pushes fresh CURRENT-TIME activity so the Segment Profile explorer (sorted by Last Activity,
  newest first) shows Lena Müller on top and the old "Lena" from the earlier demo drops down.
  1) Paste the brewfreund-store (rig) SOURCE WRITE KEY in the box — the source already connected
     to the datadrone-prod Unify space. (Segment -> Connections -> Sources -> brewfreund-store ->
     Settings -> API Keys -> Write Key.)
  2) Click "Reorder". It refreshes the 16 cast profiles, then fires Lena Müller LAST so her
     activity is the newest. The old "Lena" is never touched, so she falls below the cast.
  3) Wait ~1 min, refresh Profile explorer.
-->
<style>
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#141a22}
  .wrap{max-width:820px;margin:24px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:20px}
  h1{font-size:18px;margin:0 0 4px}
  p{color:#63707e;font-size:13px;margin:0 0 12px}
  button{border:0;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:#b3261e}
  button:disabled{opacity:.5;cursor:not-allowed}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #e5e9ef;border-radius:8px;font:13px ui-monospace,Menlo,Consolas,monospace;margin-bottom:12px}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f1620;color:#cfe3ff;border-radius:10px;padding:12px;height:320px;overflow:auto;white-space:pre-wrap;margin-top:12px}
  .log .ok{color:#7ee0a8}.log .err{color:#ff9a8f}.log .hi{color:#ffd479}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Profile explorer reorder → Lena Müller to top</h1>
    <p>Paste the <b>brewfreund-store (rig)</b> source write key. This is the source already connected to your Unify space.</p>
    <input id="key" type="text" placeholder="Paste brewfreund-store source write key here">
    <button id="go">Reorder → Lena Müller to top</button>
    <span id="state" style="color:#63707e;font-size:13px;margin-left:10px"></span>
    <div class="log" id="log">Paste the rig source write key, then click Reorder.</div>
  </div>
</div>
<script>
var API="https://api.segment.io/v1";
var PRODUCTS={
  esp:{product_id:"schwarzwald-espresso",sku:"BF-ESP-001",name:"Schwarzwald Espresso",category:"espresso",price:14.90},
  alp:{product_id:"alpengluehen-blend",sku:"BF-FIL-002",name:"Alpenglühen Blend",category:"filter",price:13.50},
  kil:{product_id:"kilimanjaro-sonnenaufgang",sku:"BF-FIL-003",name:"Kilimanjaro Sonnenaufgang",category:"filter",price:16.90},
  sum:{product_id:"sumatra-mandheling-reserve",sku:"BF-ESP-004",name:"Sumatra Mandheling Reserve",category:"espresso",price:17.50}
};
var CAST=[
  ["John Doe","john.doe@gmail.com","instagram","desktop","B","esp"],
  ["Jack Turner","jack.turner@gmail.com","instagram","mobile","A","alp"],
  ["Olivia Bennett","olivia.bennett@gmail.com","instagram","desktop","B","kil"],
  ["Mia Klein","mia.klein@web.de","instagram","mobile","A","sum"],
  ["Noah Fischer","noah.fischer@gmail.com","direct","desktop","B","esp"],
  ["Sophia Rossi","sophia.rossi@gmail.com","klaviyo","mobile","A","alp"],
  ["Emma Stone","emma.stone@gmail.com","direct","desktop","B","kil"],
  ["Ben Carter","ben.carter@gmail.com","direct","desktop","B","sum"],
  ["Lucas Weber","lucas.weber@web.de","organic","desktop","A","alp"],
  ["Anna Richter","anna.richter@gmail.com","instagram","desktop","B","kil"],
  ["Paul Neumann","paul.neumann@web.de","organic","desktop","A","esp"],
  ["Leon Wolf","leon.wolf@gmail.com","instagram","mobile","A","sum"],
  ["Hannah Koch","hannah.koch@web.de","direct","desktop","B","alp"],
  ["Julia Werner","julia.werner@gmx.de","organic","desktop","A","esp"],
  ["Marta Ricci","marta.ricci@gmail.com","klaviyo","mobile","A","kil"],
  ["Oscar Jansen","oscar.jansen@gmail.com","direct","desktop","B","sum"]
];
var logEl=document.getElementById("log");
function log(m,c){var s=document.createElement("span");if(c)s.className=c;s.textContent=m+"\n";logEl.appendChild(s);logEl.scrollTop=logEl.scrollHeight;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function consentProps(){return {consent_analytics:true,consent_marketing:true};}
function ctx(source){return {consent:{categoryPreferences:{Analytics:true,Marketing:true}},campaign:{source:source,medium:(source==="direct"||source==="organic")?source:"referral",name:"shopguide_pilot"}};}

document.getElementById("go").addEventListener("click",async function(){
  var KEY=(document.getElementById("key").value||"").trim();
  if(!KEY){log("Paste the rig source write key first.","err");return;}
  var authHeader="Basic "+btoa(KEY+":");
  async function post(kind,body){
    body.timestamp=new Date().toISOString();
    try{
      var r=await fetch(API+"/"+kind,{method:"POST",headers:{"Content-Type":"application/json","Authorization":authHeader},body:JSON.stringify(body)});
      log((r.ok?"  ✓ ":"  ✗ ")+kind+"  "+(body.event||(body.traits&&body.traits.name)||"identify")+"  "+r.status, r.ok?"ok":"err");
      return r.ok;
    }catch(e){ log("  ✗ "+kind+"  "+e.message,"err"); return false; }
  }
  var btn=this;btn.disabled=true;document.getElementById("state").textContent="reordering…";
  log("Reordering Profile explorer — cast first, Lena Müller last…","hi");
  for(var i=0;i<CAST.length;i++){
    var c=CAST[i], email=c[1].toLowerCase(), name=c[0], p=PRODUCTS[c[5]], src=c[2], dev=c[3], v=c[4];
    var gc=ctx(src);
    await post("identify",{userId:email,traits:{email:email,name:name},context:gc}); await sleep(40);
    await post("track",{userId:email,event:"Product Viewed",properties:Object.assign({},p,{currency:"EUR",brand:"Brewfreund",source:src,device_type:dev,experiment_variant:v},consentProps()),context:gc}); await sleep(60);
  }
  await sleep(500);
  var USER="lena.mueller@gmail.com", NAME="Lena Müller"; var gcl=ctx("instagram");
  await post("identify",{userId:USER,traits:{email:USER,name:NAME},context:gcl}); await sleep(60);
  await post("track",{userId:USER,event:"Page Viewed",properties:Object.assign({path:"/",source:"instagram",device_type:"mobile"},consentProps()),context:gcl});
  document.getElementById("state").textContent="reordered";
  log("\nDone. Wait ~1 min, refresh Profile explorer: Lena Müller on top, old 'Lena' pushed below the cast.","hi");
  btn.disabled=false;
});
</script>
</body>
</html>
