<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart — Brewfreund</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <section class="block-tight">
    <div class="container">
      <h1 style="font-size:clamp(2rem,3.4vw,2.8rem);">Your cart</h1>
    </div>
  </section>

  <section class="block" style="padding-top:0;">
    <div class="container" id="cart-container"></div>
  </section>
</main>

<script src="js/products.js"></script>
<script src="js/segment-analytics.js"></script>
<script src="js/app.js"></script>
<script>
  bfInitPage({ active: "shop" });

  function renderCart() {
    var lines = bfCartLines();
    var container = document.getElementById("cart-container");

    if (lines.length === 0) {
      container.innerHTML =
        '<div class="empty-state">' +
          '<h2>Your cart is empty</h2>' +
          '<p class="lede" style="margin:0 auto 24px;">Find something worth brewing.</p>' +
          '<a href="shop.html" class="btn btn-primary">Browse the shop</a>' +
        '</div>';
      return;
    }

    var subtotal = bfCartSubtotal();
    var linesHtml = lines.map(function (l) {
      return (
        '<div class="cart-line" data-id="' + l.id + '">' +
          '<div class="thumb-sm" style="' + bfThumbStyle(l.image) + '"></div>' +
          '<div>' +
            '<h3><a href="product.html?id=' + l.id + '">' + l.name + '</a></h3>' +
            '<div class="origin">' + bfPrice(l.price) + ' each</div>' +
            '<button type="button" class="remove-line" data-id="' + l.id + '">Remove</button>' +
          '</div>' +
          '<div class="qty-stepper">' +
            '<button type="button" class="line-minus" data-id="' + l.id + '" aria-label="Decrease quantity">−</button>' +
            '<input type="text" class="line-qty" data-id="' + l.id + '" value="' + l.qty + '" inputmode="numeric" aria-label="Quantity">' +
            '<button type="button" class="line-plus" data-id="' + l.id + '" aria-label="Increase quantity">+</button>' +
          '</div>' +
          '<div class="line-total">' + bfPrice(l.price * l.qty) + '</div>' +
        '</div>'
      );
    }).join("");

    container.innerHTML =
      '<div class="cart-layout">' +
        '<div class="cart-lines">' + linesHtml + '</div>' +
        '<div class="summary-card">' +
          '<div class="summary-row"><span>Subtotal</span><span>' + bfPrice(subtotal) + '</span></div>' +
          '<div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>' +
          '<div class="summary-row total"><span>Estimated total</span><span>' + bfPrice(subtotal) + '</span></div>' +
          '<a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Proceed to checkout</a>' +
          '<a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:6px;">Continue shopping</a>' +
        '</div>' +
      '</div>';

    container.querySelectorAll(".remove-line").forEach(function (btn) {
      btn.addEventListener("click", function () {
        bfRemoveFromCart(btn.dataset.id);
        bfUpdateCartBadge();
        renderCart();
      });
    });
    container.querySelectorAll(".line-minus").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = container.querySelector('.line-qty[data-id="' + btn.dataset.id + '"]');
        var next = Math.max(1, parseInt(input.value || "1", 10) - 1);
        bfUpdateQty(btn.dataset.id, next);
        bfUpdateCartBadge();
        renderCart();
      });
    });
    container.querySelectorAll(".line-plus").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = container.querySelector('.line-qty[data-id="' + btn.dataset.id + '"]');
        var next = Math.max(1, parseInt(input.value || "1", 10) + 1);
        bfUpdateQty(btn.dataset.id, next);
        bfUpdateCartBadge();
        renderCart();
      });
    });
    container.querySelectorAll(".line-qty").forEach(function (input) {
      input.addEventListener("change", function () {
        var next = Math.max(1, parseInt(input.value || "1", 10));
        bfUpdateQty(input.dataset.id, next);
        bfUpdateCartBadge();
        renderCart();
      });
    });
  }

  renderCart();

  var cart = bfGetCart();
  if (cart.items.length > 0) {
    bfTrack("Cart Viewed", {
      cart_id: cart.cartId,
      products: bfCartLines().map(function (l) {
        return { product_id: l.id, sku: l.sku, name: l.name, price: l.price, quantity: l.qty };
      })
    });
  }
</script>
</body>
</html>
