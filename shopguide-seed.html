<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopGuide Core — seed loader (EU)</title>
<!--
  ShopGuide Core seed loader.
  1) Open this page (hosted on GitHub Pages, or locally).
  2) Paste the EU source WRITE KEY into the box.
  3) Click "Seed ShopGuide Core".
  Everything is sent to the EU endpoint (events.eu1.segmentapis.com) with a consent
  object, UTM context, and experiment_variant on every event — the frozen ShopGuide Core shape.
  NOTE: the live phone->laptop merge (Act 2) is meant to be performed LIVE on real devices in the
  demo. The "Lena" block below is included so a recorded cut still has a clean merge + chat tie-in.
-->
<style>
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#141a22}
  .wrap{max-width:820px;margin:24px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:20px;margin-bottom:16px}
  h1{font-size:18px;margin:0 0 4px}
  p{color:#63707e;font-size:13px;margin:0 0 12px}
  button{border:0;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:#2f6df0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f1620;color:#cfe3ff;border-radius:10px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;margin-top:12px}
  .log .ok{color:#7ee0a8}.log .err{color:#ff9a8f}.log .hi{color:#ffd479}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ShopGuide Core — seed loader (EU)</h1>
    <p>Seeds the supporting cast, a denied-consent journey, and the Lena merge + chat tie-in. Operator page.</p>
    <input id="key" type="text" placeholder="Paste EU source write key here" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #e5e9ef;border-radius:8px;font:13px ui-monospace,Menlo,Consolas,monospace;margin-bottom:12px">
    <button id="go">Seed ShopGuide Core</button>
    <span id="state" style="color:#63707e;font-size:13px;margin-left:10px"></span>
    <div class="log" id="log">Paste the EU source WRITE KEY in the box, then click Seed.</div>
  </div>
</div>
<script>
var KEY = "";                                       // filled from the input box on the page
var API = "https://events.eu1.segmentapis.com/v1";  // EU ingestion endpoint

// Rig uses the reused Brewfreund chassis (controlled demo store), ShopGuide Core plan shape.
var PRODUCTS = {
  esp:{product_id:"schwarzwald-espresso",sku:"BF-ESP-001",name:"Schwarzwald Espresso",category:"espresso",price:14.90},
  alp:{product_id:"alpengluehen-blend",sku:"BF-FIL-002",name:"Alpenglühen Blend",category:"filter",price:13.50},
  kil:{product_id:"kilimanjaro-sonnenaufgang",sku:"BF-FIL-003",name:"Kilimanjaro Sonnenaufgang",category:"filter",price:16.90},
  sum:{product_id:"sumatra-mandheling-reserve",sku:"BF-ESP-004",name:"Sumatra Mandheling Reserve",category:"espresso",price:17.50}
};

// name, email, source, device, variant, product, buys
var CAST = [
  ["John Doe","john.doe@gmail.com","instagram","desktop","B","esp",true],
  ["Jack Turner","jack.turner@gmail.com","instagram","mobile","A","alp",true],
  ["Olivia Bennett","olivia.bennett@gmail.com","instagram","desktop","B","kil",true],
  ["Mia Klein","mia.klein@web.de","instagram","mobile","A","sum",true],
  ["Noah Fischer","noah.fischer@gmail.com","direct","desktop","B","esp",true],
  ["Sophia Rossi","sophia.rossi@gmail.com","klaviyo","mobile","A","alp",true],
  ["Emma Stone","emma.stone@gmail.com","direct","desktop","B","kil",true],
  ["Ben Carter","ben.carter@gmail.com","direct","desktop","B","sum",true],
  ["Lucas Weber","lucas.weber@web.de","organic","desktop","A","alp",true],
  ["Anna Richter","anna.richter@gmail.com","instagram","desktop","B","kil",true],
  ["Paul Neumann","paul.neumann@web.de","organic","desktop","A","esp",true],
  ["Leon Wolf","leon.wolf@gmail.com","instagram","mobile","A","sum",true],
  ["Hannah Koch","hannah.koch@web.de","direct","desktop","B","alp",true],
  ["Julia Werner","julia.werner@gmx.de","organic","desktop","A","esp",true],
  ["Marta Ricci","marta.ricci@gmail.com","klaviyo","mobile","A","kil",true],
  ["Oscar Jansen","oscar.jansen@gmail.com","direct","desktop","B","sum",true]
];

var logEl=document.getElementById("log");
function log(m,c){var s=document.createElement("span");if(c)s.className=c;s.textContent=m+"\n";logEl.appendChild(s);logEl.scrollTop=logEl.scrollHeight;}
function auth(){return "Basic "+btoa(KEY+":");}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
var DAY=24*60*60*1000;
function ts(d,min){return new Date(Date.now()-d*DAY+(min||0)*60000).toISOString();}
function uuid(){return "xxxxxxxxxxxx4xxxyxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==="x"?r:(r&0x3|0x8);return v.toString(16);});}

// consent object + UTM context on EVERY event (frozen ShopGuide Core shape)
function ctx(source, analytics, marketing){
  return {
    consent:{categoryPreferences:{Analytics:analytics!==false, Marketing:marketing!==false}},
    campaign:{source:source, medium:(source==="direct"||source==="organic")?source:"referral", name:"shopguide_pilot"}
  };
}
function consentProps(analytics, marketing){
  return {consent_analytics:analytics!==false, consent_marketing:marketing!==false};
}

async function send(kind,body){
  var res=await fetch(API+"/"+kind,{method:"POST",headers:{"Content-Type":"application/json","Authorization":auth()},body:JSON.stringify(body)});
  if(!res.ok){throw new Error(kind+" "+res.status+" "+await res.text());}
}

function buildCalls(){
  var calls=[];
  // ---- Supporting cast (consent granted) : gives the Flip its volume ----
  CAST.forEach(function(c,idx){
    var name=c[0],email=c[1].toLowerCase(),source=c[2],device=c[3],variant=c[4],p=PRODUCTS[c[5]],buys=c[6];
    var day=26-idx,min=0;
    var base={source:source,device_type:device,experiment_variant:variant};
    var context=ctx(source,true,true);
    calls.push(["identify",{userId:email,traits:{email:email,name:name},context:context,timestamp:ts(day,min)}]);min+=1;
    calls.push(["track",{userId:email,event:"Product Viewed",properties:Object.assign({},p,{currency:"EUR",brand:"Brewfreund"},base,consentProps(true,true)),context:context,timestamp:ts(day,min)}]);min+=2;
    calls.push(["track",{userId:email,event:"Experiment Viewed",properties:Object.assign({experiment_id:"pdp_cta_ab",variant:variant},consentProps(true,true)),context:context,timestamp:ts(day,min)}]);min+=1;
    if(buys){
      var cid=uuid();
      calls.push(["track",{userId:email,event:"Cart Added",properties:Object.assign({},p,{quantity:1,cart_id:cid,currency:"EUR"},consentProps(true,true)),context:context,timestamp:ts(day,min)}]);min+=2;
      calls.push(["track",{userId:email,event:"Checkout Started",properties:Object.assign({order_id:cid,value:p.price,currency:"EUR"},consentProps(true,true)),context:context,timestamp:ts(day,min)}]);min+=1;
      calls.push(["track",{userId:email,event:"Order Completed",properties:Object.assign({order_id:cid,total:p.price,revenue:p.price,currency:"EUR"},base,consentProps(true,true)),context:context,timestamp:ts(day,min)}]);
    }
  });

  // ---- Denied-consent journey : shows the Consent view / suppression story ----
  (function(){
    var email="dana.denied@gmail.com", src="instagram", day=3, min=0;
    var context=ctx(src,false,false);
    calls.push(["identify",{userId:email,traits:{email:email,name:"Dana Denied"},context:context,timestamp:ts(day,min)}]);min+=1;
    calls.push(["track",{userId:email,event:"Page Viewed",properties:Object.assign({path:"/",source:src},consentProps(false,false)),context:context,timestamp:ts(day,min)}]);min+=1;
    calls.push(["track",{userId:email,event:"Product Viewed",properties:Object.assign({},PRODUCTS.kil,{currency:"EUR",source:src},consentProps(false,false)),context:context,timestamp:ts(day,min)}]);
  })();

  // ---- LENA : cross-device merge + chat tie-in (for a recorded cut; do it LIVE in the real demo) ----
  (function(){
    var USER="lena.mueller@gmail.com", NAME="Lena Müller";
    var phone="lena-phone-"+Date.now(), laptop="lena-laptop-"+Date.now();
    var chatSession="sg_chat_"+uuid();
    var gc=ctx("instagram",true,true);
    // Phone: anonymous browse via UTM link
    calls.push(["track",{anonymousId:phone,event:"Page Viewed",properties:Object.assign({path:"/",source:"instagram",device_type:"mobile"},consentProps(true,true)),context:gc,timestamp:ts(2,0)}]);
    calls.push(["track",{anonymousId:phone,event:"Product Viewed",properties:Object.assign({},PRODUCTS.kil,{currency:"EUR",source:"instagram",device_type:"mobile"},consentProps(true,true)),context:gc,timestamp:ts(2,2)}]);
    // Laptop: newsletter signup + identify -> merge
    calls.push(["track",{anonymousId:laptop,event:"Page Viewed",properties:Object.assign({path:"/",source:"direct",device_type:"desktop"},consentProps(true,true)),context:ctx("direct",true,true),timestamp:ts(1,0)}]);
    calls.push(["track",{anonymousId:laptop,event:"Newsletter Signup",properties:Object.assign({email:USER,device_type:"desktop"},consentProps(true,true)),context:ctx("direct",true,true),timestamp:ts(1,1)}]);
    calls.push(["identify",{userId:USER,anonymousId:laptop,traits:{email:USER,name:NAME},context:ctx("direct",true,true),timestamp:ts(1,2)}]);
    calls.push(["identify",{userId:USER,anonymousId:phone,traits:{email:USER,name:NAME},context:gc,timestamp:ts(1,3)}]);
    // Chat tie-in (LABELED stand-in for ShopGuide widget): session id lands on the profile
    calls.push(["identify",{userId:USER,traits:{email:USER,name:NAME,shopguide_chat_session_id:chatSession},context:gc,timestamp:ts(1,4)}]);
    calls.push(["track",{userId:USER,event:"Chat Session Started",properties:Object.assign({shopguide_chat_session_id:chatSession,stand_in:true,device_type:"mobile"},consentProps(true,true)),context:gc,timestamp:ts(1,5)}]);
    // Her order (feeds the flip): first touch instagram/mobile, converts direct/desktop, variant B
    var cid=uuid();
    calls.push(["track",{userId:USER,event:"Cart Added",properties:Object.assign({},PRODUCTS.kil,{quantity:1,cart_id:cid,currency:"EUR"},consentProps(true,true)),context:ctx("direct",true,true),timestamp:ts(1,6)}]);
    calls.push(["track",{userId:USER,event:"Checkout Started",properties:Object.assign({order_id:cid,value:PRODUCTS.kil.price,currency:"EUR"},consentProps(true,true)),context:ctx("direct",true,true),timestamp:ts(1,7)}]);
    calls.push(["track",{userId:USER,event:"Order Completed",properties:Object.assign({order_id:cid,total:PRODUCTS.kil.price,revenue:PRODUCTS.kil.price,currency:"EUR",experiment_variant:"B",source:"direct"},consentProps(true,true)),context:ctx("direct",true,true),timestamp:ts(1,8)}]);
  })();

  return calls;
}

document.getElementById("go").addEventListener("click",async function(){
  KEY=(document.getElementById("key").value||"").trim();
  if(!KEY){log("Paste the EU source write key in the box first.","err");return;}
  var btn=this;btn.disabled=true;document.getElementById("state").textContent="sending…";
  var calls=buildCalls();
  log("Seeding "+calls.length+" calls to the EU source…","hi");
  for(var i=0;i<calls.length;i++){
    try{ await send(calls[i][0],calls[i][1]); }
    catch(e){ log("  ✗ "+e.message,"err"); document.getElementById("state").textContent="failed"; btn.disabled=false; return; }
    log("  ✓ "+calls[i][0]+"  "+(calls[i][1].event||"identify"),"ok");
    await sleep(30);
  }
  document.getElementById("state").textContent="done";
  log("\nDone. Supporting cast + denied-consent journey + Lena merge & chat tie-in seeded.","hi");
});
</script>
</body>
</html>
